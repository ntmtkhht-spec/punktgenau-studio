<!doctype html>
<!-- Szene s2 (hyperframes-gsap): Retro-CRT tippt, dann klappt eine schraege 2.5D-Sprechblase heraus.
     __W__/__H__/__U__ setzt scripts/ed.mjs je nach Format (16x9 / 9x16). bg.png = Tapete aus der Pipeline. -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <link href="roles.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: #3e3e3e; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; --u: __U__px; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #crt { position: absolute; left: 50%; top: 60%; width: calc(var(--u) * 62); transform: translate(-50%, -50%); }
      .case { background: #e6dcc3; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 4.5); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(0,0,0,0.55), inset 0 -8px 0 #cfc3a6; }
      .screen { position: relative; height: calc(var(--u) * 38); background: #050806; border-radius: calc(var(--u) * 4) / calc(var(--u) * 3); overflow: hidden; padding: calc(var(--u) * 4); box-shadow: inset 0 0 calc(var(--u) * 6) rgba(0,0,0,0.9); }
      .screen::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.35) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.10), transparent 45%); pointer-events: none; }
      .line { font-size: calc(var(--u) * 3.6); white-space: pre; line-height: 1.5; }
      .foot { height: calc(var(--u) * 4); margin-top: calc(var(--u) * 2); background: repeating-linear-gradient(90deg, #bfb397 0 4px, transparent 4px 8px); width: 30%; }
      #bubble { position: absolute; left: 47%; top: 15%; transform: translate(-50%, -50%) rotate(-7deg); }
      #bubble svg { position: absolute; inset: 0; overflow: visible; }
      .shout { position: relative; font-size: calc(var(--u) * 11); letter-spacing: 0.01em; white-space: nowrap; padding: calc(var(--u) * 2.2) calc(var(--u) * 5); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <img id="bg" class="clip" src="bg.png" data-start="0" data-duration="__DUR__" data-track-index="0" />
      <div id="crt" class="clip" data-start="0" data-duration="__DUR__" data-track-index="1">
        <div class="case">
          <div class="screen">
            <div class="line role-retro-crt-terminal" id="l1"></div>
            <div class="line role-retro-crt-terminal" id="l2"></div>
            <div class="line role-retro-crt-terminal" id="l3"></div>
          </div>
          <div class="foot"></div>
        </div>
      </div>
      <div id="bubble" class="clip" data-start="0" data-duration="__DUR__" data-track-index="2">
        <svg id="bsvg" preserveAspectRatio="none"><path id="bpath" class="bubble-fill" /></svg>
        <div class="shout role-heavy-plakat-grotesk" id="shout">Ich spiele alle.</div>
      </div>
    </div>
    <script>
      const D = __DUR__;
      const lines = [["#l1", "> SCHACH.EXE"], ["#l2", "> GEGNER: 961"], ["#l3", "> STATUS: SPIELT ALLE_"]];
      const tl = gsap.timeline({ paused: true });

      // Kamera: langsamer Push-in auf den Monitor, damit nie ein Standbild entsteht.
      tl.fromTo("#bg", { scale: 1.0 }, { scale: 1.06, duration: D, ease: "none" }, 0);
      tl.fromTo("#crt", { scale: 0.92, opacity: 0 }, { scale: 1.0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.to("#crt", { scale: 1.05, duration: D - 0.6, ease: "none" }, 0.6);

      // Tippen: Zeichen fuer Zeichen (deterministisch ueber die Timeline, nicht ueber setInterval).
      lines.forEach(([sel, text], i) => {
        const proxy = { n: 0 };
        tl.to(proxy, { n: text.length, duration: 0.5, ease: "none", onUpdate: () => { document.querySelector(sel).textContent = text.slice(0, Math.round(proxy.n)); } }, 0.4 + i * 0.55);
      });

      // Sprechblase: Umriss zeichnet sich, dann knallt die extrudierte Schrift hinein.
      const shout = document.querySelector("#shout");
      const w = shout.offsetWidth, h = shout.offsetHeight, u = __U__;
      const bsvg = document.querySelector("#bsvg");
      bsvg.setAttribute("width", w); bsvg.setAttribute("height", h + u * 9);
      const tailX = w * 0.62;
      document.querySelector("#bpath").setAttribute("d",
        `M0 0 H${w} V${h} H${tailX + u * 6} L${tailX + u * 2} ${h + u * 8} L${tailX - u * 4} ${h} H0 Z`);
      const len = document.querySelector("#bpath").getTotalLength();
      gsap.set("#bpath", { strokeDasharray: len, strokeDashoffset: len, fillOpacity: 0 });
      gsap.set("#shout", { opacity: 0, scale: 0.6 });
      const tB = Math.min(2.2, D * 0.45);
      tl.to("#bpath", { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, tB);
      tl.to("#bpath", { fillOpacity: 1, duration: 0.25 }, tB + 0.5);
      tl.to("#shout", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, tB + 0.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
